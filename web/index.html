<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ferridex</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // 首屏防闪烁:在样式应用前确定主题。
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">⛴</span><span>ferridex</span></div>
    <div class="sub">Codex + Claude 订阅本地代理</div>
    <div class="topbar-actions">
      <button id="theme-toggle" class="icon-btn" aria-label="切换深色 / 浅色主题" aria-pressed="false" title="切换深色 / 浅色主题">
        <span class="ico-light">☀️</span><span class="ico-dark">🌙</span>
      </button>
    </div>
  </header>

  <main>
    <!-- 整体健康条 -->
    <section class="healthbar" id="healthbar" aria-live="polite">
      <span class="dot" id="health-dot"></span>
      <span class="health-text" id="health-text">正在检查登录状态…</span>
    </section>

    <!-- 远程客户端配置 -->
    <section class="panel">
      <div class="panel-head">
        <span>远程客户端配置</span>
        <span class="panel-hint">复制到局域网 / SSH 主机</span>
      </div>
      <div class="client-configs">
        <div class="proxy-url-row">
          <span class="name">代理地址</span>
          <code id="proxy-url"></code>
          <button class="btn copy-btn" data-copy="proxy-url" aria-label="复制代理地址">复制</button>
        </div>
        <div class="lan-info" id="lan-info"></div>

        <div class="config-block open">
          <div class="config-head accordion-head">
            <div>
              <span class="caret" aria-hidden="true">▸</span>
              <strong>Claude Code</strong>
              <span class="lang-tag">JSON</span>
              <code>~/.claude/settings.json</code>
            </div>
            <button class="btn copy-btn" data-copy="claude-config" aria-label="复制 Claude Code 配置">一键复制</button>
          </div>
          <div class="config-body"><pre><code id="claude-config"></code></pre></div>
        </div>

        <div class="config-block open">
          <div class="config-head accordion-head">
            <div>
              <span class="caret" aria-hidden="true">▸</span>
              <strong>Codex</strong>
              <span class="lang-tag">TOML</span>
              <code>~/.codex/config.toml</code>
            </div>
            <button class="btn copy-btn" data-copy="codex-config" aria-label="复制 Codex 配置">一键复制</button>
          </div>
          <div class="config-body">
            <pre><code id="codex-config"></code></pre>
            <div class="config-block compact subblock">
              <div class="config-head">
                <div>
                  <strong>启动前执行</strong>
                  <span class="lang-tag">shell</span>
                  <span class="config-note">为 localproxy 提供占位凭据</span>
                </div>
                <button class="btn copy-btn" data-copy="codex-env" aria-label="复制启动环境变量">一键复制</button>
              </div>
              <pre><code id="codex-env"></code></pre>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- provider 状态卡片 -->
    <section class="cards" id="cards"></section>

    <!-- 接入端点 -->
    <section class="panel">
      <div class="panel-head">接入</div>
      <div class="endpoints" id="endpoints"></div>
    </section>

    <!-- SSH 反向隧道 -->
    <section class="panel tunnel-panel" id="tunnel-panel">
      <div class="panel-head">
        <span>SSH 反向隧道</span>
        <span class="badge badge-off" id="tun-badge">未运行</span>
      </div>
      <div class="tunnel">
        <div class="trow">
          <input id="tun-remote" class="inp" placeholder="user@host（远端）" autocomplete="off" spellcheck="false" />
          <input id="tun-key" class="inp" placeholder="SSH key（默认 ~/.ssh/id_ed25519）" autocomplete="off" spellcheck="false" />
        </div>
        <div class="trow">
          <button id="tun-start" class="btn primary">启动</button>
          <button id="tun-stop" class="btn">停止</button>
          <span class="tinfo" id="tun-info"></span>
        </div>
        <div class="terr" id="tun-err"></div>
      </div>
    </section>

    <!-- 实时日志 -->
    <section class="panel">
      <div class="panel-head">
        <span>实时日志</span>
        <span class="livedot" id="livedot" title="日志流" aria-hidden="true"></span>
      </div>
      <div class="log-toolbar">
        <div class="seg" role="group" aria-label="按状态码筛选">
          <button class="seg-btn active" data-filter="all">全部</button>
          <button class="seg-btn" data-filter="2">2xx</button>
          <button class="seg-btn" data-filter="4">4xx</button>
          <button class="seg-btn" data-filter="5">5xx</button>
        </div>
        <div class="log-actions">
          <button class="chip" id="log-pause" aria-pressed="false">暂停滚动</button>
          <button class="chip" id="log-clear">清空</button>
          <span class="log-count" id="log-count" title="本次会话累计 / 当前显示">0 / 0</span>
        </div>
      </div>
      <div class="log-wrap">
        <div class="log-body" id="log"></div>
        <button class="new-logs" id="new-logs" hidden>↓ <span id="new-count">0</span> 条新日志</button>
      </div>
    </section>
  </main>

  <!-- 全局 toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
